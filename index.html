<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akademik İlanlar</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mut:#667085;--line:#e3e6eb;--acc:#1d4ed8;--acc2:#e8eefc;--ok:#067647;--warn:#b54708;--onacc:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2029;--ink:#e6e9ef;--mut:#98a2b3;--line:#2a323d;--acc:#6e9bff;--acc2:#1f2a44;--ok:#4ade80;--warn:#fdb022;--onacc:#0b1220}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
  h1{font-size:18px;margin:0;flex:1 1 auto}
  .sub{color:var(--mut);font-size:13px}
  button,select,input{font:inherit;color:inherit}
  button{background:var(--acc);color:var(--onacc);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
  button.sec{background:var(--acc2);color:var(--acc)}
  button:disabled{opacity:.55;cursor:default}
  select,input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
  main{max-width:1000px;margin:0 auto;padding:16px}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-bottom:12px}
  .filters input{grid-column:1/-1}
  .item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
  .item:hover{border-color:var(--acc)}
  .item b{display:block}
  .meta{color:var(--mut);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px}
  .tag{background:var(--acc2);color:var(--acc);border-radius:99px;padding:0 8px;font-size:12px}
  .tag.arsiv{background:transparent;color:var(--warn);border:1px solid var(--warn)}
  .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:16px 0}
  dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0;width:min(900px,95vw);max-height:90vh}
  dialog::backdrop{background:#0008}
  .dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:start}
  .dh h2{font-size:17px;margin:0;flex:1}
  .db{padding:14px 18px;overflow:auto;max-height:calc(90vh - 80px)}
  .grid{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px;margin-bottom:12px}
  .grid span:nth-child(odd){color:var(--mut)}
  pre{white-space:pre-wrap;font:inherit;margin:0}
  iframe{width:100%;height:65vh;border:1px solid var(--line);border-radius:8px;background:#fff}
  #log{background:#0b0f14;color:#c9d4e3;font:12px/1.45 Consolas,monospace;padding:10px;border-radius:8px;height:260px;overflow:auto;white-space:pre-wrap;margin-top:10px}
  .empty{text-align:center;color:var(--mut);padding:40px 0}
  [hidden]{display:none!important}
  .tabs{max-width:1000px;margin:0 auto;padding:10px 16px 0;display:flex;gap:6px}
  .tab{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:8px}
  .tab.on{background:var(--acc2);color:var(--acc);border-color:var(--acc)}
  .num{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mut)}
  .num input[type=number]{width:70px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:13px;cursor:pointer;user-select:none;background:var(--card)}
  .chip.on{background:var(--acc2);color:var(--acc);border-color:var(--acc)}
  .kd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
  .kd h3{font-size:15px;margin:0 0 4px}
  .kd .sec2{color:var(--mut);font-size:13px}
  .kd details{margin-top:6px;font-size:13px}
  .kd summary{cursor:pointer;color:var(--acc)}
  .kd .sart{white-space:pre-wrap;margin:6px 0 0}
  .kd a{font-size:13px;cursor:pointer;color:var(--acc)}
  .tag.big{background:var(--acc);color:var(--onacc)}
  .bbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
  .blist{background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;padding:4px 0}
  .blist label{display:flex;gap:8px;align-items:center;padding:4px 12px;cursor:pointer;font-size:14px}
  .blist label:hover{background:var(--acc2)}
  .blist .n{margin-left:auto;color:var(--mut);font-size:12px;white-space:nowrap}
  .sg{margin:18px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--acc);display:flex;gap:10px;align-items:baseline}
  .sg h2{font-size:17px;margin:0;flex:1}
  .se{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px}
  .se ul{margin:6px 0 4px;padding-left:20px}
  .se li{margin:2px 0}
  .se .acik{color:var(--mut);font-size:13px}
  .se .yok{color:var(--warn);font-size:13px}
  .src{font-size:12.5px;color:var(--mut);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
  .src div{margin:1px 0}
  @media print{header,.tabs,.filters,.chips,.bbar,.blist,.sub,#viewKadro,#viewIlan{display:none!important}}
</style>
</head>
<body>
<header>
  <div style="flex:1 1 auto"><h1>Akademik Personel Alımları</h1><div class="sub" id="stats">…</div></div>
  <button id="cekBtn">İlanları çek / güncelle</button>
</header>
<nav class="tabs"><button class="tab on" data-v="viewKadro">Kadrolar</button><button class="tab" data-v="viewSart">Bölüm şartları</button><button class="tab" data-v="viewIlan">İlanlar</button></nav>

<main id="viewSart" hidden>
  <div class="sub" style="margin-bottom:8px">Listeden bir veya birden çok bölüm seçin; seçtiklerinizin ilan şartları bölüm bölüm, madde madde listelenir. Aynı şartı taşıyan kadrolar tek maddede birleşir.</div>
  <div class="filters">
    <input type="search" id="sbq" placeholder="Bölüm listesini filtrele (virgül = VEYA): işletme, pazarlama">
    <label class="num"><input type="checkbox" id="saktif" checked> Sadece aktif ilanlar</label>
  </div>
  <div class="chips" id="sunvan"></div>
  <div class="bbar">
    <button class="sec" id="sAll">Görünenlerin hepsini seç</button>
    <button class="sec" id="sNone">Seçimi temizle</button>
    <span class="sub" id="sSel"></span>
  </div>
  <div class="blist" id="blist"></div>
  <div class="bbar" id="sExport" hidden>
    <button class="sec" id="sMd">Markdown olarak kopyala</button>
    <button id="sXlsx">Excel'e aktar (.xlsx)</button>
    <button class="sec" id="sCsv">CSV indir</button>
    <button class="sec" onclick="window.print()">Yazdır</button>
    <span class="sub" id="sInfo"></span>
  </div>
  <div id="sOut"></div>
</main>

<main id="viewKadro">
  <div class="filters">
    <input type="search" id="kq" placeholder="Birim / bölüm / kurum ara — virgül = VEYA, boşluk = VE  (ör: işletme, pazarlama)">
    <input type="search" id="ksart" placeholder="Şartlarda / açıklamada ara (ör: doktora, yayın)">
    <select id="kil"><option value="">Tüm iller</option></select>
    <select id="kkurum"><option value="">Tüm kurumlar</option></select>
    <label class="num">ALES en çok <input type="number" id="kales" min="0" max="100" placeholder="—"></label>
    <label class="num">Kadro en az <input type="number" id="kadet" min="1" placeholder="—"></label>
    <label class="num"><input type="checkbox" id="kaktif" checked> Sadece aktif ilanlar</label>
    <select id="ksirala"><option value="yeni">En yeni ilan</option><option value="adet">Kadro sayısı</option><option value="kurum">Kuruma göre</option></select>
  </div>
  <div class="chips" id="kunvan"></div>
  <div class="sub" id="kcount" style="margin:8px 0"></div>
  <div id="klist"></div>
  <div class="pager"><button class="sec" id="kprev">‹ Önceki</button><span id="kpg"></span><button class="sec" id="knext">Sonraki ›</button></div>
</main>

<main id="viewIlan" hidden>
  <div class="filters">
    <input type="search" id="q" placeholder="Ara: başlık, kurum, ilan metni, ilan no…">
    <select id="il"><option value="">Tüm iller</option></select>
    <select id="kurum"><option value="">Tüm kurumlar</option></select>
    <select id="kategori"><option value="">Tüm kategoriler</option></select>
    <select id="arsiv"><option value="">Aktif + arşiv</option><option value="0">Sadece aktif</option><option value="1">Sadece arşiv</option></select>
    <select id="sirala"><option value="yeni">En yeni</option><option value="eski">En eski</option><option value="kurum">Kuruma göre</option><option value="goruntulenme">En çok görüntülenen</option></select>
  </div>
  <div class="sub" id="count" style="margin-bottom:8px"></div>
  <div id="list"></div>
  <div class="pager"><button class="sec" id="prev">‹ Önceki</button><span id="pg"></span><button class="sec" id="next">Sonraki ›</button></div>
</main>

<dialog id="detail">
  <div class="dh"><h2 id="dTitle"></h2><button class="sec" onclick="detail.close()">Kapat</button></div>
  <div class="db">
    <div class="grid" id="dGrid"></div>
    <div style="margin-bottom:10px"><button class="sec" id="toggle">Orijinal görünüm</button>
      <a id="dLink" target="_blank" rel="noopener" style="margin-left:10px">ilan.gov.tr'de aç ↗</a></div>
    <div id="dBody"></div>
  </div>
</dialog>

<dialog id="cekDlg">
  <div class="dh"><h2>İlanları çek</h2><button class="sec" onclick="cekDlg.close()">Kapat</button></div>
  <div class="db">
    <label><input type="checkbox" id="refresh"> Mevcut ilanların detaylarını da yeniden çek (daha uzun sürer)</label>
    <div style="margin:10px 0"><button id="start">Başlat</button> <span class="sub" id="cekState"></span></div>
    <div class="sub">Eski kayıtlar silinmez; yeni ilanlar eklenir, mevcutlar güncellenir.</div>
    <div id="log"></div>
  </div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>s?new Date(s).toLocaleDateString('tr-TR'):'';
let page=1,timer,poll;

async function api(u,o){const r=await fetch(u,o);return r.json()}

async function loadFilters(){
  const f=await api('/api/filtreler');
  for(const k of ['il','kurum','kategori']){
    const el=$(k),cur=el.value,first=el.options[0].outerHTML;
    el.innerHTML=first+f[k].map(v=>`<option>${esc(v)}</option>`).join('');el.value=cur;
  }
  $('stats').textContent=f.stats.n?`${f.stats.n} ilan kayıtlı · son güncelleme: ${f.stats.son?new Date(f.stats.son).toLocaleString('tr-TR'):'-'}`:'Henüz ilan yok — "İlanları çek" ile başlayın.';
}

async function load(){
  const p=new URLSearchParams({sayfa:page});
  for(const k of ['q','il','kurum','kategori','arsiv','sirala'])if($(k).value)p.set(k,$(k).value);
  const d=await api('/api/ilanlar?'+p);
  const pages=Math.max(1,Math.ceil(d.toplam/d.sayfa_boyutu));
  $('count').textContent=`${d.toplam} ilan`;
  $('pg').textContent=`${d.sayfa} / ${pages}`;
  $('prev').disabled=page<=1;$('next').disabled=page>=pages;
  $('list').innerHTML=d.ilanlar.length?d.ilanlar.map(i=>`
    <div class="item" data-id="${i.id}"><b>${esc(i.baslik)}</b>
    <div class="meta"><span>${esc(i.kurum)}</span><span>${esc(i.il)}</span><span>${fmt(i.yayin_tarihi)}</span>
    <span class="tag">${esc(i.alt_kategori)}</span>${i.arsivlendi?'<span class="tag arsiv">arşiv</span>':''}
    <span>${i.goruntulenme??0} görüntülenme</span></div></div>`).join(''):'<div class="empty">Sonuç yok.</div>';
}

let cur=null,showHtml=true;
function renderBody(){
  $('toggle').textContent=showHtml?'Düz metin göster':'Orijinal görünüm';
  $('dBody').innerHTML=showHtml
    ?'<iframe sandbox="" id="fr"></iframe>':`<pre style="overflow-x:auto;white-space:pre-wrap">${esc(cur.icerik_metin||'(Detay henüz çekilmedi)')}</pre>`;
  if(showHtml)$('fr').srcdoc='<base target="_blank"><style>body{font:14px/1.5 system-ui,sans-serif;color:#111;margin:12px;overflow-wrap:anywhere}table{border-collapse:collapse;max-width:100%}td,th{border:1px solid #999;padding:4px 6px;vertical-align:top}</style>'+(cur.icerik_html||'');
}
async function open_(id){
  cur=await api('/api/ilan/'+id);showHtml=true;
  $('dTitle').textContent=cur.baslik;$('dLink').href=cur.url;
  const rows=[['İlan no',cur.ilan_no],['Kurum',cur.kurum],['İl / İlçe',[cur.il,cur.ilce].filter(Boolean).join(' / ')],
    ['Kategori',cur.kategori],['Yayın',fmt(cur.yayin_tarihi)],['Resmî Gazete',cur.resmi_gazete_tarihi],
    ['Görüntülenme',cur.goruntulenme],['Durum',cur.arsivlendi?'Arşivde':'Aktif'],['İlk görülme',fmt(cur.ilk_gorulme)]];
  $('dGrid').innerHTML=rows.filter(r=>r[1]).map(r=>`<span>${r[0]}</span><span>${esc(r[1])}</span>`).join('');
  renderBody();$('detail').showModal();
}

$('list').onclick=e=>{const it=e.target.closest('.item');if(it)open_(it.dataset.id)};
$('toggle').onclick=()=>{showHtml=!showHtml;renderBody()};
$('prev').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};
for(const k of ['il','kurum','kategori','arsiv','sirala'])$(k).onchange=()=>{page=1;load()};
$('q').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;load()},300)};

async function refreshStatus(){
  const s=await api('/api/durum');
  const box=$('log'),atBottom=box.scrollTop+box.clientHeight>=box.scrollHeight-20;
  box.textContent=s.log.join('\n');if(atBottom)box.scrollTop=box.scrollHeight;
  $('start').disabled=s.running;$('cekBtn').textContent=s.running?'Çekiliyor…':'İlanları çek / güncelle';
  $('cekState').textContent=s.running?'Çalışıyor…':(s.returncode===null?'':(s.returncode===0?'Tamamlandı ✓':'Hata ile bitti (kod '+s.returncode+')'));
  if(!s.running&&poll){clearInterval(poll);poll=null;page=1;kpage=1;loadFilters();load();loadKadro()}
}
function startPoll(){if(!poll)poll=setInterval(refreshStatus,1000);refreshStatus()}
$('cekBtn').onclick=()=>{$('cekDlg').showModal();refreshStatus()};
$('start').onclick=async()=>{
  const r=await api('/api/cek',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh:$('refresh').checked})});
  $('cekState').textContent=r.mesaj;startPoll();
};
api('/api/durum').then(s=>{if(s.running)startPoll()});

/* ---------- Kadrolar ---------- */
let kpage=1,ktimer,unvanSel=new Set();
async function loadKadro(){
  const p=new URLSearchParams({sayfa:kpage,sirala:$('ksirala').value});
  if($('kq').value.trim())p.set('q',$('kq').value);
  if($('ksart').value.trim())p.set('sart',$('ksart').value);
  if($('kil').value)p.set('il',$('kil').value);
  if($('kkurum').value)p.set('kurum',$('kkurum').value);
  if($('kales').value)p.set('ales_max',$('kales').value);
  if($('kadet').value)p.set('min_adet',$('kadet').value);
  if($('kaktif').checked)p.set('aktif','1');
  if(unvanSel.size)p.set('unvan',[...unvanSel].join('|'));
  const d=await api('/api/kadrolar?'+p);
  const pages=Math.max(1,Math.ceil(d.toplam/d.sayfa_boyutu));
  $('kcount').textContent=`${d.toplam} kadro satırı · toplam ${d.toplam_adet??0} kadro adedi`;
  $('kpg').textContent=`${d.sayfa} / ${pages}`;
  $('kprev').disabled=kpage<=1;$('knext').disabled=kpage>=pages;
  $('klist').innerHTML=d.kadrolar.length?d.kadrolar.map(k=>{
    const yer=[k.birim,k.bolum,k.anabilim_dali].filter((v,i,a)=>v&&a.indexOf(v)===i).join(' › ');
    const sart=[k.uzmanlik&&('Uzmanlık: '+k.uzmanlik),k.sartlar,k.aciklama].filter(Boolean).join('\n\n');
    return `<div class="kd"><h3>${esc(yer||'(birim belirtilmemiş)')}</h3>
    <div class="meta"><span class="tag big">${esc(k.unvan_grup||k.unvan)}</span>
      <span class="tag">${k.kadro_sayisi??'?'} kadro</span>
      ${k.derece?`<span class="tag">Derece ${esc(k.derece)}</span>`:''}
      ${k.ales_min!=null?`<span class="tag">ALES ≥ ${k.ales_min}${k.ales_puan_turu?' ('+esc(k.ales_puan_turu)+')':''}</span>`:(k.ales_puani?`<span class="tag">ALES ${esc(k.ales_puani)}</span>`:'')}
      ${k.dil_min!=null?`<span class="tag">Dil ≥ ${k.dil_min}</span>`:(k.yabanci_dil_puani?`<span class="tag">Dil ${esc(k.yabanci_dil_puani)}</span>`:'')}
      ${k.arsivlendi?'<span class="tag arsiv">arşiv</span>':''}</div>
    <div class="sec2">${esc(k.kurum)} · ${esc(k.il)} · ${fmt(k.yayin_tarihi)}${k.pozisyon_no?' · İlan no '+esc(k.pozisyon_no):''}</div>
    ${sart?`<details><summary>Şartlar</summary><div class="sart">${esc(sart)}</div></details>`:''}
    <a onclick="open_(${k.ilan_id})">İlanın tamamı ›</a></div>`}).join(''):'<div class="empty">Sonuç yok.</div>';
}
async function loadKFilters(){
  const f=await api('/api/filtreler');
  for(const [id,key] of [['kil','il'],['kkurum','kurum']]){
    const el=$(id),cur=el.value,first=el.options[0].outerHTML;
    el.innerHTML=first+f[key].map(v=>`<option>${esc(v)}</option>`).join('');el.value=cur;
  }
  $('kunvan').innerHTML=(f.unvan_grup||[]).map(u=>`<span class="chip${unvanSel.has(u)?' on':''}" data-u="${esc(u)}">${esc(u)}</span>`).join('');
  $('sunvan').innerHTML=(f.unvan_grup||[]).map(u=>`<span class="chip${sUnvan.has(u)?' on':''}" data-u="${esc(u)}">${esc(u)}</span>`).join('');
}
$('kunvan').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const u=c.dataset.u;
  unvanSel.has(u)?unvanSel.delete(u):unvanSel.add(u);c.classList.toggle('on');kpage=1;loadKadro()};
for(const k of ['kil','kkurum','kaktif','ksirala'])$(k).onchange=()=>{kpage=1;loadKadro()};
for(const k of ['kq','ksart','kales','kadet'])$(k).oninput=()=>{clearTimeout(ktimer);ktimer=setTimeout(()=>{kpage=1;loadKadro()},300)};
$('kprev').onclick=()=>{kpage--;loadKadro()};$('knext').onclick=()=>{kpage++;loadKadro()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  for(const v of ['viewKadro','viewSart','viewIlan'])$(v).hidden=v!==b.dataset.v;
  if(b.dataset.v==='viewSart'&&!$('blist').dataset.loaded)loadBolumler();
});
/* ---------- Bolum sartlari ---------- */
const selB=new Map(),sUnvan=new Set();let sdata=null,sTimer;
const ales=k=>k.ales_min!=null?`ALES ≥ ${k.ales_min}${k.ales_puan_turu?' ('+k.ales_puan_turu+')':''}`:(k.ales_puani?'ALES '+k.ales_puani:'');
const dil=k=>k.dil_min!=null?`Dil ≥ ${k.dil_min}`:(k.yabanci_dil_puani?'Dil '+k.yabanci_dil_puani:'');
const srcLine=k=>[k.kurum,[k.birim,k.anabilim_dali].filter((v,i,a)=>v&&a.indexOf(v)===i).join(' › '),
  (k.kadro_sayisi??'?')+' kadro',k.derece&&'Derece '+k.derece,ales(k),dil(k),k.il,fmt(k.yayin_tarihi)].filter(Boolean).join(' · ');

async function loadBolumler(){
  const p=new URLSearchParams();
  if($('sbq').value.trim())p.set('q',$('sbq').value);
  if($('saktif').checked)p.set('aktif','1');
  if(sUnvan.size)p.set('unvan',[...sUnvan].join('|'));
  const d=await api('/api/bolumler?'+p);
  $('blist').dataset.loaded='1';
  window._bl=d.bolumler;
  $('blist').innerHTML=d.bolumler.length?d.bolumler.map(b=>`<label><input type="checkbox" data-k="${esc(b.key)}" data-ad="${esc(b.ad)}"${selB.has(b.key)?' checked':''}>
    <span>${esc(b.ad)}</span><span class="n">${b.kurum} kurum · ${b.kadro??b.satir} kadro</span></label>`).join(''):'<div class="empty">Bölüm bulunamadı.</div>';
  updSel();
}
function updSel(){$('sSel').textContent=`${selB.size} bölüm seçili · listede ${(window._bl||[]).length} bölüm görünüyor`}
$('blist').onchange=e=>{const c=e.target;if(c.dataset.k===undefined)return;
  c.checked?selB.set(c.dataset.k,c.dataset.ad):selB.delete(c.dataset.k);updSel();schedReport()};
$('sAll').onclick=()=>{(window._bl||[]).forEach(b=>selB.set(b.key,b.ad));
  $('blist').querySelectorAll('input').forEach(i=>i.checked=true);updSel();schedReport()};
$('sNone').onclick=()=>{selB.clear();$('blist').querySelectorAll('input').forEach(i=>i.checked=false);updSel();schedReport()};
$('sbq').oninput=()=>{clearTimeout(sTimer);sTimer=setTimeout(loadBolumler,300)};
$('saktif').onchange=()=>{loadBolumler();schedReport()};
$('sunvan').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const u=c.dataset.u;
  sUnvan.has(u)?sUnvan.delete(u):sUnvan.add(u);c.classList.toggle('on');loadBolumler();schedReport()};
let rTimer;function schedReport(){clearTimeout(rTimer);rTimer=setTimeout(report,350)}

async function report(){
  if(!selB.size){sdata=null;$('sOut').innerHTML='<div class="empty">Henüz bölüm seçilmedi.</div>';$('sExport').hidden=true;return}
  sdata=await api('/api/sartlar',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({bolumler:[...selB.keys()],unvan:[...sUnvan],aktif:$('saktif').checked})});
  const kadro=sdata.gruplar.reduce((a,g)=>a+g.kadro_toplam,0);
  $('sInfo').textContent=`${sdata.gruplar.length} bölüm · ${sdata.toplam_satir} kadro satırı · ${kadro} kadro`;
  $('sExport').hidden=false;
  $('sOut').innerHTML=sdata.gruplar.map(g=>`<div class="sg"><h2>${esc(g.ad)}</h2><span class="sub">${g.kadro_toplam} kadro</span></div>`+
    g.girdiler.map(e=>{
      const has=e.sart_maddeleri.length||e.aciklama_maddeleri.length||e.uzmanlik;
      return `<div class="se"><span class="tag big">${esc(e.unvan_grup)}</span>
        ${e.kaynaklar.length>1?`<span class="tag">${e.kaynaklar.length} kurumda aynı şart</span>`:''}
        ${e.uzmanlik?`<div class="acik">Uzmanlık alanı: ${esc(e.uzmanlik)}</div>`:''}
        ${e.sart_maddeleri.length?`<ul>${e.sart_maddeleri.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`:''}
        ${e.aciklama_maddeleri.length?`<div class="acik">Açıklama:</div><ul class="acik">${e.aciklama_maddeleri.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`:''}
        ${has?'':'<div class="yok">Tabloda özel şart belirtilmemiş (genel şartlar için ilan metnine bakın).</div>'}
        <div class="src">${e.kaynaklar.map(k=>`<div>${esc(srcLine(k))} · <a href="#" onclick="open_(${k.ilan_id});return false">ilan</a></div>`).join('')}</div></div>`}).join('')).join('');
}
function toMd(){
  return sdata.gruplar.map(g=>`## ${g.ad} (${g.kadro_toplam} kadro)\n\n`+g.girdiler.map(e=>
    `### ${e.unvan_grup}${e.kaynaklar.length>1?` — ${e.kaynaklar.length} kurumda aynı şart`:''}\n`+
    (e.uzmanlik?`Uzmanlık alanı: ${e.uzmanlik}\n`:'')+
    e.sart_maddeleri.map(m=>`- ${m}`).join('\n')+(e.sart_maddeleri.length?'\n':'')+
    (e.aciklama_maddeleri.length?'Açıklama:\n'+e.aciklama_maddeleri.map(m=>`- ${m}`).join('\n')+'\n':'')+
    (e.sart_maddeleri.length||e.aciklama_maddeleri.length||e.uzmanlik?'':'_Tabloda özel şart belirtilmemiş._\n')+
    '\nKaynaklar:\n'+e.kaynaklar.map(k=>`- ${srcLine(k)} — ${k.url}`).join('\n')+'\n').join('\n')).join('\n');
}
$('sMd').onclick=async()=>{if(!sdata)return;try{await navigator.clipboard.writeText(toMd());$('sInfo').textContent='Markdown panoya kopyalandı ✓'}
  catch{const w=window.open('','_blank');w.document.write('<pre>'+esc(toMd())+'</pre>')}};
$('sXlsx').onclick=async()=>{if(!selB.size)return;
  $('sInfo').textContent='Excel hazırlanıyor…';
  const r=await fetch('/api/sartlar.xlsx',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({bolumler:[...selB.keys()],unvan:[...sUnvan],aktif:$('saktif').checked})});
  if(!r.ok){const e=await r.json().catch(()=>({}));$('sInfo').textContent='Hata: '+(e.hata||r.status);return}
  const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='bolum_sartlari.xlsx';a.click();
  $('sInfo').textContent='Excel indirildi ✓'};
$('sCsv').onclick=()=>{if(!sdata)return;
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['Bölüm','Ünvan','Kurum','İl','Birim','Anabilim dalı','Kadro','Derece','ALES','Yabancı dil','Özel şartlar','Açıklama','Uzmanlık','İlan']];
  for(const g of sdata.gruplar)for(const e of g.girdiler)for(const k of e.kaynaklar)
    rows.push([g.ad,e.unvan_grup,k.kurum,k.il,k.birim,k.anabilim_dali,k.kadro_sayisi,k.derece,ales(k),dil(k),
      e.sart_maddeleri.join('\n'),e.aciklama_maddeleri.join('\n'),e.uzmanlik,k.url]);
  const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bolum_sartlari.csv';a.click()};

const _lf=loadFilters;loadFilters=async function(){await _lf();await loadKFilters()};
loadFilters();load();loadKadro();
</script>
</body>
</html>
